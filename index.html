:root{color-scheme:light;--bg:#f4f5f7;--panel:#ffffff;--panel2:#ffffff;--line:#dfe2e7;--ink:#14181f;--muted:#5f6672;--gold:#1c2a44;--gold2:#1c2a44;--acc:#7a1f2b;--down:#f2d43d;--up:#5aa64a;--new:#4f86c6;--wa:#25d366}

html{scroll-padding-top:150px}

.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.brand{padding:24px 0 18px;text-align:center;background:#1c2a44;color:#fff}

.tag{color:#c9cfda;font-size:14px;margin:6px 0 0}

.bar{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
.search{position:relative}
.search input{width:100%;font:16px Manrope,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 44px 13px 44px;outline:none}
.search input:focus{border-color:var(--gold)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.7}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:22px;width:40px;height:40px;cursor:pointer;display:none}
.search.has button{display:block}
.note{margin:14px 0 0;padding:12px 14px;border:1px solid #e6c9cd;border-left:4px solid var(--acc);background:#fff;border-radius:10px;font-size:14px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px 0 30px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:150px;padding:84px 14px 14px;border-radius:14px;background:var(--panel);box-shadow:0 1px 2px rgba(20,24,31,.05);color:#1c2a44;border:1px solid var(--line);text-decoration:none;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.tile:hover,.tile:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}
.tile svg{color:#1c2a44;position:absolute;right:10px;top:10px;width:64px;height:78px}

.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 14px;font:600 14px Manrope,sans-serif;cursor:pointer;white-space:nowrap;min-height:40px}

  flute:`<svg viewBox="0 0 64 78"><path ${F} d="M25 20h14l-1 22h-12z"/><path ${G} d="M24 4h16l-2 40c0 4-3 6-6 6s-6-2-6-6z"/><path ${G} d="M32 50v18M22 72h20"/><circle cx="31" cy="30" r="1.6" fill="currentColor"/><circle cx="34" cy="22" r="1.4" fill="currentColor"/></svg>`,
  liqueur:`<svg viewBox="0 0 64 78"><path ${F} d="M16 38h32v34H16z"/><path ${G} d="M27 4h10v14h4l7 12v42a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V30l7-12h4z"/><path ${G} d="M22 48h20v14H22z"/></svg>`,
  beer:`<svg viewBox="0 0 64 78"><path ${F} d="M12 30h30v40H12z"/><path ${G} d="M12 20h30v50a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4z"/><path ${G} d="M42 30h6a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6h-6"/><path ${G} d="M12 20c0-6 6-8 10-6 2-5 10-5 12 0 4-2 9 1 8 6"/></svg>`,
  cocktail:`<svg viewBox="0 0 64 78"><path ${F} d="M16 18h32L32 36z"/><path ${G} d="M8 8h48L32 38z"/><path ${G} d="M32 38v28M20 72h24"/><path ${G} d="M44 4l-8 14"/></svg>`,
  can:`<svg viewBox="0 0 64 78"><path ${F} d="M18 30h28v36H18z"/><rect ${G} x="18" y="12" width="28" height="60" rx="5"/><path ${G} d="M18 22h28M18 62h28"/></svg>`,
  star:`<svg viewBox="0 0 64 78"><path ${F} ${G} d="M32 10l7 15 16 2-12 11 3 16-14-8-14 8 3-16L9 27l16-2z"/></svg>`,
  tag:`<svg viewBox="0 0 64 78"><path ${F} ${G} d="M8 30V12h18l30 30-18 18z"/><circle ${G} cx="18" cy="22" r="4"/><path ${G} d="M30 50l12-12"/></svg>`,
  gift:`<svg viewBox="0 0 64 78"><path ${F} d="M12 34h40v36H12z"/><path ${G} d="M10 26h44v10H10zM14 36h36v36H14zM32 26v46"/><path ${G} d="M32 26c-4-10-16-12-14-4 1 3 6 4 14 4 8 0 13-1 14-4 2-8-10-6-14 4z"/></svg>`
};
const nice = s => s;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’]/g,'').replace(/[^a-z0-9 ]/g,' ');
const money = v => '$' + Math.round(v).toLocaleString('es-MX');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const items = DATA.items.map(([cat,name,pz,unit,box,ch,unitBox,boxFull,dup]) => ({cat,name,pz,unit,box,ch,unitBox,boxFull,dup,key:norm(name+' '+SUBNAME(cat))}));
const groupOf = {};
GROUPS.forEach(g => g[2] && g[2].forEach(c => groupOf[c] = g[0]));
const inGroup = (g, i) => g[0]==='ofertas' ? i.ch==='b' : (g[2]||[]).includes(i.cat);
// tipos por nombre (solo para la categoría principal del grupo)
const TYPES = {
  tequila: [['Cristalino',/CRISTALINO|HERRADURA CRISTAL|DON JULIO 70|DOBEL DIAMANTE/],['Extra añejo',/EXTRA A[ÑN]EJO|CENTENARIO LEYENDA|1800 MILENIO/],['Añejo',/A[ÑN]EJO|DON JULIO 1942/],['Reposado',/REPOSADO|\bREP\b|CENTENARIO AZUL/],['Blanco',/BLANCO|PLATA|SILVER|PLATINO|PLATINUM|\bBCO\b|\bBL\b/]],
  whisky: [['Bourbon y americano',/BOURBON|FIREBALL|JACK DANIEL|JIM BEAM|MAKER|WILD TURKEY|GENTLEMAN|BULLEIT|WOODFORD|CROWN ROYAL|RYE/],['Irlandés',/JAMESON|BUSHMILLS|TULLAMORE|IRISH/],['Single malt',/SINGLE|GLENFIDD?ICH|GLENLIVET|MACALLAN|DALWHINNIE|CARDHU|SINGLETON|TALISKER|LAGAVULIN|OBAN|BALVENIE/],['Japonés',/HIBIKI|TOKI|SUNTORY|NIKKA|YAMAZAKI/]]
};
const DEFTYPE = {tequila:'Otros', whisky:'Escocés (blend)'};
function typeOf(gid,i){
  const g = GROUPS.find(x=>x[0]===gid); if(!g || !g[2] || i.cat!==g[2][0]) return null;
  for(const [lbl,re] of TYPES[gid]) if(re.test(i.name)) return lbl;
  return DEFTYPE[gid] || null;
}
const $ = id => document.getElementById(id);
const qEl=$('q'), sbox=$('sbox'), home=$('home'), view=$('view'), out=$('out'), sortEl=$('sort'), subsEl=$('subs');
let cur=null, sub='', filt='';

// home tiles
$('grid').innerHTML = GROUPS.map(g => {
  const n = items.filter(i => inGroup(g,i)).length;
  if(!n) return '';
  return '<a class="tile'+(g[0]==='ofertas'||g[0]==='nuevos'?' hot':'')+'" href="#'+g[0]+'">'+ICONS[g[3]]+'<b>'+esc(g[1])+'</b><small>'+n+' producto'+(n>1?'s':'')+'</small></a>';
}).join('');
$('notes').innerHTML = DATA.notes.map(n => '<div class="note">'+esc(n)+'</div>').join('');

const waIcon = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.2 1.4z"/></svg>';
function wa(i){
  const msg = 'Hola, me interesa: '+i.name+(i.unit!=null?' ('+money(i.unit)+' c/u)':'');
  return '<a class="wa" href="https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener" aria-label="Pedir por WhatsApp" title="Pedir por WhatsApp">'+waIcon+'</a>';
}
function badge(ch){
  return ch==='b'?'<span class="badge b-b">Bajó</span>':ch==='s'?'<span class="badge b-s">Subió</span>':ch==='n'?'<span class="badge b-n">En oferta</span>':ch==='n2'?'<span class="badge b-n2">Nuevo</span>':'';
}
function row(i, showCat){
  const unit = i.unit!=null ? '<div class="price"><div class="pv"><span class="l">Botella</span><span class="v">'+money(i.unit)+'</span></div>'+addBtn(i,'b')+'</div>' : '<div class="price"></div>';
  let box = '<div class="price box"></div>';
  if(i.box!=null){
    box = '<div class="price box"><div class="pv"><span class="l">'+(i.pz===1?'Precio':'Caja · '+(i.pz?i.pz+' pzas':''))+'</span>'+
      '<span class="v">'+(i.boxFull!=null && i.boxFull>i.box ? '<s>'+money(i.boxFull)+'</s>' : '')+money(i.box)+'</span></div>'+addBtn(i,'c')+'</div>';
  }
  return '<div class="item"><div class="nm">'+esc(i.name)+(i.dup==='N'?badge('n2'):'')+badge(i.ch)+(showCat?'<span class="cat">'+esc(SUBNAME(i.cat))+'</span>':'')+'</div>'+unit+box+'</div>';
}
// ---- carrito ----
items.forEach((i,k)=>i.id=k);
let cart = {};
try{ cart = JSON.parse(localStorage.getItem('pedido')||'{}') || {}; }catch(e){ cart={}; }
const save = () => { try{ localStorage.setItem('pedido', JSON.stringify(cart)); }catch(e){} };
const keyOf = (i,t) => i.id+':'+t;
function addBtn(i,t){
  const q = cart[keyOf(i,t)]||0;
  const lbl = t==='c' ? (i.pz===1?'Pieza':'Caja') : 'Botella';
  const ico = t==='c' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M10 2h4v4l2 3v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/></svg>';
  return '<button class="add '+(t==='c'?'c':'b')+(q?' on':'')+'" data-add="'+keyOf(i,t)+'" aria-label="Agregar '+lbl.toLowerCase()+' al pedido'+(q?' ('+q+' en tu pedido)':'')+'" title="Agregar '+lbl.toLowerCase()+'">+'+ico+(q?'<span class="n">'+q+'</span>':'')+'</button>';
}
function lines(){
  return Object.entries(cart).filter(([k,q])=>q>0).map(([k,q])=>{
    const [id,t]=k.split(':'); const i=items[+id]; if(!i) return null;
    const p = t==='c'? i.box : i.unit;
    return {k,i,t,q,p,sub:p*q};
  }).filter(Boolean);
}
function cartTotal(){ return lines().reduce((s,l)=>s+l.sub,0); }
function cartCount(){ return lines().reduce((s,l)=>s+l.q,0); }
function updateBar(){
  const n=cartCount(); document.body.classList.toggle('hascart', n>0);
  let bar=$('cartbar');
  if(!n){ if(bar) bar.remove(); return; }
  if(!bar){ bar=document.createElement('div'); bar.id='cartbar'; bar.className='cartbar'; document.body.appendChild(bar); }
  bar.innerHTML='<div class="ct">Tu pedido · '+n+' artículo'+(n>1?'s':'')+'<b>'+money(cartTotal())+'</b></div><button class="send" id="seecart" type="button">Ver pedido ›</button>';
}
function waText(){
  const L=lines();
  let s='Hola, quiero hacer este pedido:\n';
  L.forEach(l=>{ s+='• '+l.q+' '+(l.t==='c'?(l.i.pz===1?'pza'+(l.q>1?'s':''):'caja'+(l.q>1?'s':'')+(l.i.pz?' ('+l.i.pz+' pzas)':'')):'botella'+(l.q>1?'s':''))+' – '+l.i.name+' – '+money(l.sub)+'\n'; });
  s+='Total: '+money(cartTotal())+'\n\nEntrega a domicilio en: ';
  return s;
}
function sendCart(){ const u='https://wa.me/'+PHONE+'?text='+encodeURIComponent(waText()); window.location.href=u; }
function openSheet(){
  closeSheet();
  const L=lines(); const d=document.createElement('div'); d.className='sheet'; d.id='sheet';
  d.innerHTML='<div class="pn" role="dialog" aria-modal="true" aria-label="Tu pedido"><button class="x" id="xs" aria-label="Cerrar">×</button><h2>Tu pedido</h2>'+
    (L.length? L.map(l=>'<div class="ci"><div><div class="n">'+esc(l.i.name)+'</div><div class="s">'+(l.t==='c'?(l.i.pz===1?'Pieza':'Caja'+(l.i.pz?' de '+l.i.pz:'')):'Botella')+' · '+money(l.p)+' c/u</div></div><div class="r">'+money(l.sub)+'</div><div class="qty"><button data-q="'+l.k+'" data-d="-1" aria-label="Quitar uno">−</button><span>'+l.q+'</span><button data-q="'+l.k+'" data-d="1" aria-label="Agregar uno">+</button><button class="rm" data-q="'+l.k+'" data-d="x">Quitar</button></div></div>').join('') : '<p class="empty">Tu pedido está vacío.</p>')+
    '<div class="tot"><span>Total</span><span>'+money(cartTotal())+'</span></div><p class="fine">Entregas a domicilio. Te confirmamos existencia y entrega por WhatsApp.</p>'+
    (L.length?'<button class="go" id="go" type="button">Enviar pedido por WhatsApp</button><button class="more" id="xs2" type="button">Seguir agregando</button>':'')+'</div>';
  document.body.appendChild(d);
}
function closeSheet(){ const s=$('sheet'); if(s) s.remove(); }
function bump(k,d){
  if(d==='x') delete cart[k]; else { cart[k]=(cart[k]||0)+(+d); if(cart[k]<=0) delete cart[k]; }
  save(); updateBar();
}
document.addEventListener('click', e => {
  const a=e.target.closest('[data-add]');
  if(a){ bump(a.dataset.add,1); const [id,t]=a.dataset.add.split(':'); a.outerHTML=addBtn(items[+id],t); return; }
  const q=e.target.closest('[data-q]');
  if(q){ bump(q.dataset.q,q.dataset.d); show(); if(cartCount()) openSheet(); else closeSheet(); return; }
  if(e.target.closest('#seecart')){ openSheet(); return; }
  if(e.target.closest('#sendcart')||e.target.closest('#go')){ sendCart(); return; }
  if(e.target.closest('#xs')||e.target.closest('#xs2')||e.target.id==='sheet'){ closeSheet(); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });

function sortList(a){
  const s = sortEl.value;
  const pv = i => i.unit ?? i.box ?? 0;
  if(s==='pa') a.sort((x,y)=>pv(x)-pv(y));
  if(s==='pd') a.sort((x,y)=>pv(y)-pv(x));
  if(s==='az') a.sort((x,y)=>x.name.localeCompare(y.name,'es'));
  return a;
}
function renderList(list, grouped){
  if(!list.length){ out.innerHTML = '<p class="empty">No encontramos productos. Escríbenos por WhatsApp y te lo conseguimos.</p>'; return; }
  if(!grouped || sortEl.value){ const sc = !cur || cur==='ofertas' || (sortEl.value && grouped); out.innerHTML = '<div class="list">'+list.map(i=>row(i, sc)).join('')+'</div>'; return; }
  let html='', c=null;
  for(const i of list){
    if(i.cat!==c){ if(c!==null) html+='</div>'; c=i.cat; html+='<div class="sub">'+esc(SUBNAME(c))+'</div><div class="list">'; }
    html+=row(i,false);
  }
  out.innerHTML = html+'</div>';
}
function show(){
  const terms = norm(qEl.value).split(' ').filter(Boolean);
  sbox.classList.toggle('has', !!qEl.value);
  const id = location.hash.slice(1);
  const g = GROUPS.find(x => x[0]===id);
  if(terms.length){
    home.hidden=true; view.hidden=false; subsEl.innerHTML='';
    $('vt').textContent = 'Resultados';
    let list = items.filter(i => i.dup!=='D' && terms.every(t => i.key.includes(t)) && (!filt || i.ch===filt));
    list = sortList(list);
    $('count').textContent = list.length+' producto'+(list.length===1?'':'s');
    renderList(list, false);
    return;
  }
  if(!g){ home.hidden=false; view.hidden=true; cur=null; return; }
  home.hidden=true; view.hidden=false;
  if(cur!==g[0]){ cur=g[0]; sub=''; filt=''; sortEl.value=''; syncChips(); window.scrollTo(0,0); }
  $('vt').textContent = g[1];
  let list = items.filter(i => inGroup(g,i));
  const present = new Set(list.map(i=>i.cat));
  const cats = g[2] ? g[2].filter(c=>present.has(c)) : [...present];
  const types = TYPES[g[0]];
  let opts = [];
  if(types){
    opts = types.map(([lbl]) => lbl).concat(DEFTYPE[g[0]]?[DEFTYPE[g[0]]]:[]).map(lbl => ['t:'+lbl, lbl, list.filter(i=>typeOf(g[0],i)===lbl).length]).filter(o=>o[2]>0);
    cats.filter(c=>!g[2] || c!==g[2][0]).forEach(c => opts.push([c, SUBNAME(c), list.filter(i=>i.cat===c).length]));
  } else if(cats.length>1 && g[0]!=='ofertas'){
    opts = cats.map(c => [c, SUBNAME(c), list.filter(i=>i.cat===c).length]);
  }
  subsEl.innerHTML = opts.length ? ['<button class="chip" data-s="" aria-pressed="'+(sub===''?'true':'false')+'">Todos</button>'].concat(opts.map(o=>'<button class="chip" data-s="'+esc(o[0])+'" aria-pressed="'+(sub===o[0]?'true':'false')+'">'+esc(o[1])+' <span style="opacity:.6;font-weight:600">'+o[2]+'</span></button>')).join('') : '';
  if(sub && sub.startsWith('t:')) list = list.filter(i => typeOf(g[0],i)===sub.slice(2));
  else if(sub) list = list.filter(i => i.cat===sub);
  if(filt) list = list.filter(i => i.ch===filt);
  if(g[2]) list.sort((a,b)=>g[2].indexOf(a.cat)-g[2].indexOf(b.cat));
  list = sortList(list);
  $('count').textContent = list.length+' producto'+(list.length===1?'':'s');
  renderList(list, g[0]!=='ofertas' && cats.length>1);
}
function syncChips(){ document.querySelectorAll('.tools .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f===filt?'true':'false')); }
document.querySelectorAll('.tools .chip').forEach(c => c.addEventListener('click', () => { filt = filt===c.dataset.f ? '' : c.dataset.f; syncChips(); show(); }));
subsEl.addEventListener('click', e => { const b=e.target.closest('[data-s]'); if(!b) return; sub=b.dataset.s; show(); });
sortEl.addEventListener('change', show);
let t; qEl.addEventListener('input', () => { clearTimeout(t); t=setTimeout(show,120); });
$('qx').addEventListener('click', () => { qEl.value=''; show(); qEl.focus(); });
$('back').addEventListener('click', () => { if(qEl.value){ qEl.value=''; } if(location.hash){ history.pushState(null,'',location.pathname+location.search); } show(); window.scrollTo(0,0); });
window.addEventListener('hashchange', show);
show();
updateBar();
}
</script>
</body>
</html>
